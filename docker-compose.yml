# claude_room — laboratório do Claude
# Subir só o workspace:   docker compose up -d --build workspace
# Subir com Oracle de teste: docker compose --profile oracle up -d
services:
  workspace:
    build: ./docker/workspace
    container_name: claude_room_workspace
    command: sleep infinity
    working_dir: /home/claude/claude_room
    volumes:
      - ./:/home/claude/claude_room          # só este repo; nada do resto do PC
      - claude_home:/home/claude             # sessão/config persistentes do usuário claude
    env_file:
      - path: .env
        required: false
    networks: [lab]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    cpus: 2

  oracle:
    profiles: ["oracle"]
    image: gvenzl/oracle-xe:21-slim
    container_name: claude_room_oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}   # obrigatorio so no profile oracle: definir no .env
    ports:
      - "127.0.0.1:1522:1521"                # 1521 do host já é o Oracle local do Caio
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks: [lab]
    mem_limit: 3g

networks:
  lab:
    driver: bridge

volumes:
  claude_home:
  oracle_data:
